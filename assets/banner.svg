<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#131d36"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter using robust feMerge -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes dashMove {
      to { stroke-dashoffset: -48; }
    }
    @keyframes dashMoveRev {
      to { stroke-dashoffset: 48; }
    }
    .stream-line {
      stroke-dasharray: 8 6;
      animation: dashMove 2.5s linear infinite;
    }
    .stream-line-rev {
      stroke-dasharray: 8 6;
      animation: dashMoveRev 3s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Ambient Circuit Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="450" y1="0" x2="450" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="750" y1="0" x2="750" y2="340"/>
    <line x1="900" y1="0" x2="900" y2="340"/>
    <line x1="1050" y1="0" x2="1050" y2="340"/>
  </g>

  <!-- Ambient Dynamic Networking & Order Routing Paths (Background) -->
  <g>
    <!-- Background Flow Path 1 -->
    <path d="M 80 170 Q 240 50, 420 130 T 780 90 T 1120 170" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.35"/>
    <path d="M 80 170 Q 240 50, 420 130 T 780 90 T 1120 170" fill="none" stroke="#38bdf8" stroke-width="2.5" class="stream-line" opacity="0.75">
      <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="2.5s" repeatCount="indefinite"/>
    </path>

    <!-- Background Flow Path 2 -->
    <path d="M 120 270 Q 360 320, 600 230 T 1080 260" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.3"/>
    <path d="M 120 270 Q 360 320, 600 230 T 1080 260" fill="none" stroke="#c084fc" stroke-width="2" class="stream-line-rev" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="0" to="48" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Dynamic Pulsing Nodes (SMIL for universal SVG support) -->
    <g transform="translate(80, 170)">
      <circle r="14" fill="none" stroke="#38bdf8" stroke-width="1.5">
        <animate attributeName="r" values="8;20;8" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="#38bdf8"/>
    </g>

    <g transform="translate(1120, 170)">
      <circle r="14" fill="none" stroke="#a855f7" stroke-width="1.5">
        <animate attributeName="r" values="8;20;8" begin="1s" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.1;0.8" begin="1s" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="#a855f7"/>
    </g>

    <g transform="translate(600, 230)">
      <circle r="12" fill="none" stroke="#34d399" stroke-width="1.5">
        <animate attributeName="r" values="6;16;6" begin="0.5s" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0.1;0.8" begin="0.5s" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle r="5" fill="#34d399"/>
    </g>
  </g>

  <!-- Floating Dynamic Decorative Cards (Using SMIL animateTransform) -->
  <!-- Left Upper Dynamic Card -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="60,40; 60,33; 60,40" dur="5s" repeatCount="indefinite"/>
    <rect width="180" height="52" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="26" r="6" fill="#38bdf8"/>
    <text x="38" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ORCHESTRATION</text>
    <text x="38" y="39" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Real-Time Sagas</text>
  </g>

  <!-- Left Lower Dynamic Card -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="50,230; 50,237; 50,230" dur="6s" repeatCount="indefinite"/>
    <rect width="190" height="52" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="26" r="6" fill="#34d399"/>
    <text x="38" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">INVENTORY ROUTING</text>
    <text x="38" y="39" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Multi-Node Fulfillment</text>
  </g>

  <!-- Right Upper Dynamic Card -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="950,40; 950,47; 950,40" dur="6s" repeatCount="indefinite"/>
    <rect width="190" height="52" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="26" r="6" fill="#818cf8"/>
    <text x="38" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">OMNICHANNEL DOM</text>
    <text x="38" y="39" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">BOPIS / Ship-From-Store</text>
  </g>

  <!-- Right Lower Dynamic Card -->
  <g filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="960,230; 960,223; 960,230" dur="5s" repeatCount="indefinite"/>
    <rect width="180" height="52" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" opacity="0.95"/>
    <circle cx="24" cy="26" r="6" fill="#c084fc"/>
    <text x="38" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ECOSYSTEM</text>
    <text x="38" y="39" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">SaaS &amp; Open Source</text>
  </g>

  <!-- FOREGROUND: High-Contrast Clear Text Header (Never obstructed) -->
  <g text-anchor="middle">
    <!-- Category Pill Badge -->
    <rect x="460" y="44" width="280" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="600" y="63" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">DISTRIBUTED ORDER MANAGEMENT</text>

    <!-- Main Title -->
    <text x="600" y="142" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome Distributed Order Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="184" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">
      Order Orchestration &#8226; Inventory Routing &#8226; Omnichannel Fulfillment
    </text>

    <!-- Feature Highlights / Tags -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      <rect x="365" y="218" width="130" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="430" y="237" fill="#38bdf8">&#8226; Event-Driven</text>

      <rect x="510" y="218" width="180" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
      <text x="600" y="237" fill="#818cf8">&#8226; Saga Orchestration</text>

      <rect x="705" y="218" width="130" height="28" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
      <text x="770" y="237" fill="#34d399">&#8226; Multi-Cloud</text>
    </g>
  </g>
</svg>
